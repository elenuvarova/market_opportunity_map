services:
  - type: web
    name: market-opportunity-map-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGIN
        value: https://market-opportunity-map-web.onrender.com

  - type: web
    name: market-opportunity-map-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://market-opportunity-map-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
